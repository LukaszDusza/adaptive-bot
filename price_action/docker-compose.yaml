services:

  bot-eth-syl:
    container_name: eth-syl
    build: .
    env_file:
      - .env_sylwia
    volumes:
      # Mount only essential directories for trading
      - ./models:/app/models
      - ./logs:/app/logs
      - ./bot_state:/app/bot_state
    restart: unless-stopped
    command: >
      python main.py --run-bot
      --ticker ETHUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h
      --prob-threshold 0.6
      --tsl-pct 0.03
      --tp-pct 0.015
      --trade-size 50.0
      --leverage 10 
      --partial-tp


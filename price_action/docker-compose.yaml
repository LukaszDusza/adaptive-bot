# ============================================================================
# UPDATED: 2025-10-21 - Deployment v1.2 (Pipeline v2.0)
# ============================================================================
# Changes from v1.1:
#   - version: v1.1 → v1.2 (all critical fixes applied)
#   - prob-threshold: 0.54 → 0.60 (optimized on calibration set)
#   - min-proba-diff: 0.3 → 0.35 (higher confidence threshold)
#
# v1.2 Backtest Results (vs v1.1):
#   - Total Return: +7.36% (+39% better than v1.1)
#   - Win Rate: 80.5% (+2.8pp vs v1.1)
#   - Profit Factor: 5.48 (+41% vs v1.1)
#   - Sharpe: 11.90 (+25% vs v1.1)
# ============================================================================

services:

  bot-syl-sol-dynamic-tp:
    container_name: syl-sol-dynamic-tp
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=syl-sol-dynamic-tp
    env_file:
      - .env_sylwia
    restart: unless-stopped
    volumes:
      - ./prediction_logs:/app/prediction_logs
    command: >
      python main.py --run-bot
      --version v1.2
      --ticker SOLUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size 100.0
      --leverage 10
      --partial-tp

  bot-luk-sol-dynamic-tp:
    container_name: luk-sol-dynamic-tp
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-sol-dynamic-tp
    env_file:
      - .env_luk
    restart: unless-stopped
    volumes:
      - ./prediction_logs:/app/prediction_logs
    command: >
      python main.py --run-bot
      --version v1.2
      --ticker SOLUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size 300.0
      --leverage 10
      --partial-tp
      --hedge-mode

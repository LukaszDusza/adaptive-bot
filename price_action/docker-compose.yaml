# ============================================================================
# DEPLOYMENT - 4 bots with DCA mode (DOGE, SOL, PEPE, LINK)
# ============================================================================

x-bot-base: &bot-base
  image: adaptive-bot:latest
  build:
    context: .
    dockerfile: Dockerfile
    cache_from:
      - adaptive-bot:latest

x-bot-common: &bot-common
  restart: on-failure:5
  volumes:
    - ./models:/app/models
    - ./logs:/app/logs
    - ./bot_state:/app/bot_state
    - ./prediction_logs:/app/prediction_logs
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 256M
  healthcheck:
    test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/bot_state') and os.access('/app/bot_state', os.W_OK) else 1)"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s

services:

  bot-base:
    <<: *bot-base
    container_name: bot-base-builder
    command: echo "Base image built successfully"
    profiles:
      - build-only

  # DOGEUSDT - DCA Mode
  bot-luk-doge-dca:
    <<: [*bot-base, *bot-common]
    container_name: luk-doge-dca
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-doge-dca
    env_file:
      - .env_luk
    command: >
      python bot.py
      --version v1.2.doge
      --ticker DOGEUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size-pct 0.02
      --leverage 20
      --partial-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 5
      --dca-mode
      --dca-level1-pct 0.01
      --dca-atr-multiplier 1.8
      --dca-max-swing-distance 2.0

  # SOLUSDT - DCA Mode
  bot-luk-sol-ict:
    <<: [*bot-base, *bot-common]
    container_name: luk-sol-ict
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-sol-ict
    env_file:
      - .env_luk
    command: >
      python bot.py
      --version v1.2.1.sol
      --ticker SOLUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 1D
      --prob-threshold 0.58
      --min-proba-diff 0.29
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size-pct 0.02
      --leverage 20
      --partial-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 5
      --dca-mode
      --dca-level1-pct 0.01
      --dca-atr-multiplier 1.8
      --dca-max-swing-distance 2.0

  # 1000PEPEUSDT - DCA Mode
  bot-luk-pepe:
    <<: [*bot-base, *bot-common]
    container_name: luk-pepe
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-pepe
    env_file:
      - .env_luk
    command: >
      python bot.py
      --version v1.2.1000pepe
      --ticker 1000PEPEUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size-pct 0.02
      --leverage 20
      --partial-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 5
      --dca-mode
      --dca-level1-pct 0.01
      --dca-atr-multiplier 1.8
      --dca-max-swing-distance 2.0

  # LINKUSDT - DCA Mode
  bot-luk-link:
    <<: [*bot-base, *bot-common]
    container_name: luk-link
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-link
    env_file:
      - .env_luk
    command: >
      python bot.py
      --version v1.2.link
      --ticker LINKUSDT
      --timeframe 15m
      --helper-timeframes 4h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size-pct 0.02
      --leverage 20
      --partial-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 5
      --dca-mode
      --dca-level1-pct 0.01
      --dca-atr-multiplier 1.8
      --dca-max-swing-distance 2.0

  bot-luk-bnb:
    <<: [ *bot-base, *bot-common ]
    container_name: luk-bnb
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-bnb
    env_file:
      - .env_luk
    command: >
      python bot.py
      --version v1.2.bnb
      --ticker BNBUSDT
      --timeframe 15m
      --helper-timeframes 6h 12h 1D
      --prob-threshold 0.60
      --min-proba-diff 0.35
      --tsl-pct 0.014
      --tp-pct 0.02
      --trade-size-pct 0.02
      --leverage 20
      --partial-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 5
      --dca-mode
      --dca-level1-pct 0.01
      --dca-atr-multiplier 1.8
      --dca-max-swing-distance 2.0

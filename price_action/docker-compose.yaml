
x-bot-base: &bot-base
  image: adaptive-bot:latest
  build:
    context: .
    dockerfile: Dockerfile
    cache_from:
      - adaptive-bot:latest

x-bot-common: &bot-common
  restart: on-failure:5
  volumes:
    - ./models:/app/models
    - ./logs:/app/logs
    - ./bot_state:/app/bot_state
    - ./prediction_logs:/app/prediction_logs
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 256M
  healthcheck:
    test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/bot_state') and os.access('/app/bot_state', os.W_OK) else 1)"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s

services:

  bot-base:
    <<: *bot-base
    container_name: bot-base-builder
    command: echo "Base image built successfully"
    profiles:
      - build-only

  # ============================================
  # DOGEUSDT - v1.2.doge
  # UPDATED: prob-threshold 0.38 -> 0.6039 (ML optimal)
  # OPTIMIZED: TP 0.0156->0.025, TSL 0.0102->0.008, Dynamic TP (R:R fix)
  # ============================================
  bot-luk-doge-dca:
    <<: [*bot-base, *bot-common]
    container_name: luk-doge-dca
    environment:
      - PYTHONUNBUFFERED=1
      - CONTAINER_NAME=luk-doge-dca
    env_file:
      - .env_luk
      - .env_common
    command: >
      python bot.py
      --version v1.2.doge
      --ticker DOGEUSDT
      --timeframe 15m
      --helper-timeframes 1h 4h 6h 12h 1d
      --prob-threshold 0.6039
      --min-confidence-ratio 1.3
      --tsl-pct 0.008
      --tp-pct 0.025
      --trade-size-pct 0.05
      --leverage 20
      --dynamic-tp
      --hedge-mode
      --limit-order
      --limit-order-candles 16
      --dca-mode
      --dca-level1-pct 0.006
      --dca-atr-multiplier 1.5
      --dca-max-swing-distance 1.5


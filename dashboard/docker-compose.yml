# Docker Compose for Dashboard (production deployment)

version: '3.8'

services:
  dashboard-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptive-bot-dashboard-api
    ports:
      - "8000:8000"
    volumes:
      - ../price_action/logs:/app/logs:ro
      - ../price_action/bot_state:/app/bot_state:ro
      - ../price_action/models:/app/models:ro
      - ../price_action/prediction_logs:/app/prediction_logs:ro
      - ../price_action:/app/price_action:ro  # For BybitAdapter access
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker management
    env_file:
      - ../price_action/.env_luk  # Bybit API credentials
    environment:
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_WS_URL=ws://localhost:3000/api/ws
    container_name: adaptive-bot-dashboard-ui
    ports:
      - "3000:80"
    depends_on:
      - dashboard-api
    restart: unless-stopped
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
